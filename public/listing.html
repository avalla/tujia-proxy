<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing — Tujia EN</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/listing.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">途</span>
      <div>
        <h1>Tujia <span class="accent">EN</span></h1>
        <p class="tagline">Chinese apartment rentals, in English</p>
      </div>
    </a>
    <a class="back-link" href="/">← Back to search</a>
  </div>
</header>

<main class="wrap detail" id="detail">
  <div class="status"><div class="status-inner"><h2>Loading listing…</h2></div></div>
</main>

<footer class="wrap foot">
  <p>
    Unofficial English proxy for <a href="https://m.tujia.com" rel="noreferrer noopener" target="_blank">m.tujia.com</a>.
    Prices convert at a fixed rate and are indicative; booking happens on Tujia in Chinese.
  </p>
</footer>

<script src="/listing.js"></script>
</body>
</html>
